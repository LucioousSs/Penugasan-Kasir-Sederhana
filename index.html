<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body>
    <section class="menu-kasir">
    <div class="logo">
        <h1 class="head-logo">Program Kasir Sederhana</h1>
    </div>
    <div class="listing">
        <label for="harga">Harga Barang: </label> <br>
        <input type="text" id="harga"><br>
    </div>

    <div class="listing">
        <label for="jumlah">Jumlah Belanja: </label> <br>
        <input type="text" id="jumlah"><br>
    </div>

    <button onclick = "hitungTotalBelanja()">Harga Total</button>

    <div class="output">
        <p id="diskonText"></p>
        <p id="totalBelanja"></p>
    </div>

</section>
<script>
    function hitungTotalBelanja(){
        let harga = Number(document.getElementById("harga").value);
        let jumlah = Number(document.getElementById("jumlah").value);
        let diskonText = document.getElementById("diskonText");
        let totalBelanja = document.getElementById("totalBelanja");

        if (isNaN(harga) || isNaN(jumlah) || harga <= 0 || jumlah <= 0) {
            diskonText.innerHTML = "";
            totalBelanja.innerHTML = "Isi harga dan jumlah belanja terlebih dahulu.";
            return;
        }

        let total = harga * jumlah;
        let potongan = 0;

        if (total > 100000){
            potongan = total * 10/100;
            total = total - potongan;
        }

        diskonText.innerHTML = potongan > 0 ? "Diskon: " + potongan : "";

        totalBelanja.innerHTML = "Total Belanja: " + total;
    }
</script>
    
</body>
</html>
